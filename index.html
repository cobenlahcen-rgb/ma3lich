<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ma3lich Pay — Secure Checkout</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-color: #0b0f1a;
            --card-bg: #161b2c;
            --primary-blue: #3b82f6;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #2d3748;
        }

        body {
            background-color: var(--bg-color);
            font-family: 'Inter', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            color: var(--text-main);
        }

        .checkout-container {
            background: var(--card-bg);
            width: 90%;
            max-width: 440px;
            border-radius: 12px;
            padding: 2.5rem;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            border: 1px solid var(--border-color);
        }

        .brand-header {
            text-align: left;
            margin-bottom: 2rem;
        }

        .brand-header h2 {
            margin: 0;
            font-size: 1.25rem;
            font-weight: 700;
        }

        .brand-header p {
            font-size: 0.85rem;
            color: #10b981; /* Success Green */
            margin-top: 5px;
        }

        .product-card {
            background: rgba(255, 255, 255, 0.03);
            border-radius: 8px;
            padding: 1.5rem;
            margin-bottom: 2rem;
            border: 1px solid var(--border-color);
        }

        .product-card h3 {
            margin: 0;
            font-size: 1.1rem;
        }

        .product-card p {
            font-size: 0.9rem;
            color: var(--text-muted);
            margin: 0.5rem 0 1rem;
        }

        .price-section {
            font-size: 2.25rem;
            font-weight: 700;
        }

        .price-section span {
            font-size: 1rem;
            color: var(--text-muted);
            font-weight: 400;
        }

        .start-btn {
            display: block;
            background: var(--primary-blue);
            color: white;
            text-align: center;
            text-decoration: none;
            padding: 1.1rem;
            border-radius: 8px;
            font-weight: 600;
            font-size: 1rem;
            transition: all 0.2s ease;
        }

        .start-btn:hover {
            background: #2563eb;
            transform: translateY(-1px);
        }

        .trust-footer {
            margin-top: 2rem;
            text-align: center;
            border-top: 1px solid var(--border-color);
            padding-top: 1.5rem;
        }

        .payment-icons {
            display: flex;
            justify-content: center;
            gap: 12px;
            opacity: 0.6;
            margin-bottom: 1rem;
        }

        .payment-icons img {
            height: 18px;
        }

        .secured-by {
            font-size: 0.75rem;
            color: var(--text-muted);
        }
    </style>
</head>
<body>

    <div class="checkout-container">
        <div class="brand-header">
            <h2>Ma3lich Pay — Secure Checkout</h2>
            <p>Encrypted SSL Payment • Official Support</p>
        </div>

        <div class="product-card">
            <h3>Premium USA Pass</h3>
            <p>Instant activation for all channels & VOD</p>
            <div class="price-section">
                $2.00 <span>/ month after trial</span>
            </div>
        </div>

        <a href="https://whop.com/checkout/plan_XXXX" class="start-btn">
            Start free trial
        </a>

        <div class="trust-footer">
            <div class="payment-icons">
                <img src="https://upload.wikimedia.org/wikipedia/commons/5/5e/Visa_Inc._logo.svg" alt="Visa">
                <img src="https://upload.wikimedia.org/wikipedia/commons/2/2a/Mastercard-logo.svg" alt="Mastercard">
                <img src="https://upload.wikimedia.org/wikipedia/commons/b/b5/PayPal.svg" alt="PayPal">
                <img src="https://upload.wikimedia.org/wikipedia/commons/4/46/Bitcoin.svg" alt="Crypto">
            </div>
            <p class="secured-by">Secured by <strong>Whop</strong></p>
        </div>
    </div>

</body>
</html>
